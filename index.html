    // --- DEFAULT BUILT-IN PRESETS (Section 10) ---
    const DEFAULT_PRESETS = [
      {
        id: "preset_clean_customers",
        name: "Clean Customer List",
        description: "Removes empty & duplicate rows, trims whitespace, and standardizes emails.",
        isBuiltIn: true,

        isBuiltIn: true,

      },
      {

        name: "Standardize Contact Information",
        description: "Trims names, formats US phone numbers, and lowercases email addresses.",
        isBuiltIn: true,
        operations: ["Trim All Whitespace", "Normalize Internal Spaces", "Clean Email Addresses", "Standardize Phone Numbers"]
      },
      {

      },

    // --- DATA QUALITY ANALYZER (Section 7) ---
    function analyzeQuality(dataset) {
      if (!dataset || !dataset.rows || dataset.rows.length === 0) {
        return { score: 100, formula: "100 - penalties", emptyRows: 0, duplicateRows: 0, emptyCells: 0, totalCells: 0, categories: [] };
      }

      const totalRows = dataset.rows.length;
      const totalCols = dataset.columns.length;
      const totalCells = totalRows * totalCols;

      let emptyRows = 0;
      let emptyCells = 0;
      let unpaddedWhitespace = 0;
      let duplicateRows = 0;
      const seenRows = new Set();

      dataset.rows.forEach(row => {
        if (row.every(c => !c || c.toString().trim() === '')) emptyRows++;
        const fp = row.join('\0');
        if (seenRows.has(fp)) duplicateRows++;
        else seenRows.add(fp);
      });

      const categories = [];
      const missingIssues = [];
      const duplicateIssues = [];
      const textIssues = [];
      const numericIssues = [];
      const dateIssues = [];
      const contactIssues = [];

      // Check cells
      dataset.columns.forEach((col, cIdx) => {
        let colEmpty = 0;
        let colDirtyNums = 0;
        let colMixedDates = 0;
        let colBadEmails = 0;
        let colSuspiciousPhones = 0;

        dataset.rows.forEach(row => {
          const val = (row[cIdx] || '').toString();
          if (val === '' || val.trim() === '') {
            emptyCells++;
            colEmpty++;
          } else {
            if (val.startsWith(' ') || val.endsWith(' ')) unpaddedWhitespace++;
            if (val.includes('  ')) textIssues.push({ title: 'Repeated internal spaces', col });
            
            // Numbers
            if ((val.includes('$') || val.includes('€') || val.includes(',')) && !isNaN(parseFloat(val.replace(/[\$,€]/g, '')))) {
              colDirtyNums++;
            }
            // Dates
            if (/\d{1,2}\/\d{1,2}\/\d{4}/.test(val) || /\d{1,2}-[A-Za-z]{3}-\d{4}/.test(val)) {
              colMixedDates++;
            }
            // Emails
            if (col.toLowerCase().includes('email')) {
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
              if (!emailRegex.test(val.trim())) colBadEmails++;
            }
            // Phones
            if (col.toLowerCase().includes('phone')) {
              const digits = val.replace(/\D/g, '');
              if (digits.length < 7 || digits.length > 15) colSuspiciousPhones++;
            }
          }
        });

        if (colDirtyNums > 0) {
          numericIssues.push({ id: `num_${col}`, title: `Formatted Numbers / Currencies in '${col}'`, count: colDirtyNums, severity: 'WARNING', col, op: 'Clean & Convert to Numeric' });
        }
        if (colMixedDates > 0) {
          dateIssues.push({ id: `date_${col}`, title: `Non-ISO Date Formats in '${col}'`, count: colMixedDates, severity: 'WARNING', col, op: 'Standardize Dates to ISO' });
        }
        if (colBadEmails > 0) {
          contactIssues.push({ id: `email_${col}`, title: `Invalid Email Formats in '${col}'`, count: colBadEmails, severity: 'ERROR', col, op: 'Clean Email Addresses' });
        }
        if (colSuspiciousPhones > 0) {
          contactIssues.push({ id: `phone_${col}`, title: `Suspicious Phone Numbers in '${col}'`, count: colSuspiciousPhones, severity: 'WARNING', col, op: 'Standardize Phone Numbers' });
        }
      });

      if (emptyRows > 0) {
        missingIssues.push({ id: 'empty_rows', title: 'Fully Empty Rows', count: emptyRows, severity: 'ERROR', op: 'Remove Empty Rows' });
      }
      if (emptyCells > 0) {
        missingIssues.push({ id: 'empty_cells', title: 'Blank / Null Cells', count: emptyCells, severity: 'WARNING', op: 'Normalize Blank Values' });
      }
      if (duplicateRows > 0) {
        duplicateIssues.push({ id: 'dup_rows', title: 'Exact Duplicate Rows', count: duplicateRows, severity: 'ERROR', op: 'Remove Exact Duplicate Rows' });
      }
      if (unpaddedWhitespace > 0) {
        textIssues.push({ id: 'whitespace', title: 'Leading / Trailing Whitespace', count: unpaddedWhitespace, severity: 'WARNING', op: 'Trim All Whitespace' });
      }

      if (missingIssues.length > 0) categories.push({ name: 'Missing Data', issues: missingIssues });
      if (duplicateIssues.length > 0) categories.push({ name: 'Duplicates', issues: duplicateIssues });
      if (textIssues.length > 0) categories.push({ name: 'Text Quality', issues: textIssues });
      if (numericIssues.length > 0) categories.push({ name: 'Numeric Quality', issues: numericIssues });
      if (dateIssues.length > 0) categories.push({ name: 'Date Standardization', issues: dateIssues });
      if (contactIssues.length > 0) categories.push({ name: 'Contact Data', issues: contactIssues });

      // Documented score formula:
      const emptyRatio = Math.min(1, emptyCells / Math.max(1, totalCells));
      const dupRatio = Math.min(1, duplicateRows / Math.max(1, totalRows));
      const wsRatio = Math.min(1, unpaddedWhitespace / Math.max(1, totalCells));
      const penalty = (emptyRatio * 30) + (dupRatio * 30) + (wsRatio * 20) + (missingIssues.filter(i => i.severity === 'ERROR').length * 5);
      const score = Math.max(15, Math.min(100, Math.round(100 - penalty)));

      return {
        score,
        formula: "100 - (emptyCells × 30% + duplicateRows × 30% + whitespace × 20% + criticalErrors × 5%)",
        emptyRows,
        duplicateRows,
        emptyCells,
        totalCells,
        totalIssues: categories.reduce((sum, cat) => sum + cat.issues.length, 0),
        categories
      };
    }

    // --- CLEANING OPERATIONS ENGINE (Section 8) ---
    function applyOperation(dataset, opName) {
      if (!dataset || !dataset.rows) return dataset;
      let newRows = dataset.rows.map(r => [...r]);
      let newCols = [...dataset.columns];

      switch (opName) {
        case "Remove Empty Rows":
          newRows = newRows.filter(r => r.some(c => c && c.toString().trim() !== ''));
          break;

        case "Remove Empty Columns":
          const keepIndices = newCols.map((_, idx) => idx).filter(idx => newRows.some(r => r[idx] && r[idx].toString().trim() !== ''));
          newCols = keepIndices.map(idx => newCols[idx]);
          newRows = newRows.map(r => keepIndices.map(idx => r[idx] || ''));
          break;

        case "Remove Exact Duplicate Rows":
          const seen = new Set();
          const deduped = [];
          newRows.forEach(row => {
            const key = row.join('\0');
            if (!seen.has(key)) {
              seen.add(key);
              deduped.push(row);
            }
          });
          newRows = deduped;
          break;

        case "Trim All Whitespace":
          newRows = newRows.map(r => r.map(c => (c || '').toString().trim()));
          break;

        case "Normalize Internal Spaces":
          newRows = newRows.map(r => r.map(c => (c || '').toString().replace(/\s+/g, ' ')));
          break;

        case "Convert to Lowercase":
          newRows = newRows.map(r => r.map(c => (c || '').toString().toLowerCase()));
          break;

        case "Convert to Uppercase":
          newRows = newRows.map(r => r.map(c => (c || '').toString().toUpperCase()));
          break;

        case "Convert to Title Case":
          newRows = newRows.map(r => r.map(c => {
            const str = (c || '').toString();
            return str.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
          }));
          break;

        case "Normalize Blank Values":
          newRows = newRows.map(r => r.map(c => {
            const trimmed = (c || '').toString().trim().toLowerCase();
            return (trimmed === '' || trimmed === 'null' || trimmed === 'none' || trimmed === 'n/a') ? '' : c;
          }));
          break;

        case "Clean & Convert to Numeric":
          newRows = newRows.map(r => r.map(c => {
            const str = (c || '').toString().trim();
            if (str.includes('$') || str.includes('€') || str.includes(',')) {
              const cleaned = str.replace(/[\$,€]/g, '').trim();
              const num = parseFloat(cleaned);
              return !isNaN(num) ? num.toString() : str;
            }
            return c;
          }));
          break;

        case "Standardize Dates to ISO":
          newRows = newRows.map(r => r.map(c => {
            const str = (c || '').toString().trim();
            // Check MM/DD/YYYY
            const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) {
              const month = m[1].padStart(2, '0');
              const day = m[2].padStart(2, '0');
              return `${m[3]}-${month}-${day}`;
            }
            return c;
          }));
          break;

        case "Clean Email Addresses":
          const emailColIdx = newCols.findIndex(c => c.toLowerCase().includes('email'));
          if (emailColIdx !== -1) {
            newRows = newRows.map(r => {
              const email = (r[emailColIdx] || '').toString().trim().toLowerCase();
              r[emailColIdx] = email;
              return r;
            });
          }
          break;

        case "Standardize Phone Numbers":
          const phoneColIdx = newCols.findIndex(c => c.toLowerCase().includes('phone'));
          if (phoneColIdx !== -1) {
            newRows = newRows.map(r => {
              const digits = (r[phoneColIdx] || '').toString().replace(/\D/g, '');
              if (digits.length === 10) {
                r[phoneColIdx] = `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
              }
              return r;
            });
          }
          break;

        case "Fill Blanks with N/A":
          newRows = newRows.map(r => r.map(c => (c === '' || c == null || c.toString().trim() === '') ? 'N/A' : c));
          break;

        default:
          break;
      }

      return {
        ...dataset,
        columns: newCols,
        rows: newRows
      };
    }

    // --- MAIN APP COMPONENT ---
    function TabloraApp() {
      const [currentScreen, setCurrentScreen] = useState('dashboard');
      const [dataset, setDataset] = useState(SAMPLE_DATASETS.customers);
      const [originalDataset, setOriginalDataset] = useState(SAMPLE_DATASETS.customers);
      const [undoStack, setUndoStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);
      const [appliedOps, setAppliedOps] = useState([]);
      const [presets, setPresets] = useState(() => {
        try {
          const saved = localStorage.getItem('tablora_presets');
          return saved ? JSON.parse(saved) : DEFAULT_PRESETS;
        } catch (_) { return DEFAULT_PRESETS; }
      });
      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('tablora_history');
          return saved ? JSON.parse(saved) : [];
        } catch (_) { return []; }
      });
      const [density, setDensity] = useState('normal');
      const [defaultFormat, setDefaultFormat] = useState('CSV');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortCol, setSortCol] = useState(null);
      const [sortAsc, setSortAsc] = useState(true);
      const [currentPage, setCurrentPage] = useState(0);
      const [pageSize, setPageSize] = useState(20);
      const [activeModal, setActiveModal] = useState(null);
      const [pendingOp, setPendingOp] = useState(null);
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiPlan, setAiPlan] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      const fileInputRef = useRef(null);

      // Re-initialize Lucide icons after renders
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Show toast helper
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Quality Report
      const qualityReport = useMemo(() => analyzeQuality(dataset), [dataset]);

      // Load Dataset
      const loadDataset = (newDs) => {
        setDataset(newDs);
        setOriginalDataset(newDs);
        setUndoStack([]);
        setRedoStack([]);
        setAppliedOps([]);
        setSearchQuery('');
        setSortCol(null);
        setCurrentPage(0);
        showToast(`Loaded ${newDs.rows.length} rows from ${newDs.name}`);
      };

      // Handle File Upload (CSV & XLSX via SheetJS / PapaParse)
      const handleFile = (file) => {
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) {
          showToast("File exceeds 20 MB size limit.");
          return;
        }

        const fileName = file.name;
        const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');

        if (isExcel) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array' });
              const sheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[sheetName];
              const json = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
              if (json && json.length > 0) {
                const columns = (json[0] || []).map((c, i) => (c || `Column_${i+1}`).toString().trim());
                const rows = json.slice(1).map(r => columns.map((_, i) => (r[i] != null ? r[i].toString() : '')));
                loadDataset({ name: fileName, format: 'XLSX', columns, rows });
                setCurrentScreen('workspace');
              }
            } catch (err) {
              showToast("Failed to parse Excel workbook: " + err.message);
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          window.Papa.parse(file, {
            skipEmptyLines: false,
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                const columns = (results.data[0] || []).map((c, i) => (c || `Column_${i+1}`).toString().trim());
                const rows = results.data.slice(1).map(r => columns.map((_, i) => (r[i] != null ? r[i].toString() : '')));
                loadDataset({ name: fileName, format: 'CSV', columns, rows });
                setCurrentScreen('workspace');
              }
            },
            error: (err) => showToast("CSV parsing error: " + err.message)
          });
        }
      };

      // Preview & Apply Operation
      const executeOp = (opName) => {
        setUndoStack(prev => [...prev, dataset]);
        setRedoStack([]);
        const updated = applyOperation(dataset, opName);
        setDataset(updated);
        setAppliedOps(prev => [...prev, opName]);
        setActiveModal(null);
        showToast(`Applied: ${opName}`);
      };

      // Undo / Redo / Reset
      const handleUndo = () => {
        if (undoStack.length === 0) return;
        const previous = undoStack[undoStack.length - 1];
        setRedoStack(prev => [dataset, ...prev]);
        setUndoStack(prev => prev.slice(0, -1));
        setDataset(previous);
        setAppliedOps(prev => prev.slice(0, -1));
        showToast("Undid last operation");
      };

      const handleRedo = () => {
        if (redoStack.length === 0) return;
        const next = redoStack[0];
        setUndoStack(prev => [...prev, dataset]);
        setRedoStack(prev => prev.slice(1));
        setDataset(next);
        showToast("Redid operation");
      };

      const handleReset = () => {
        if (!originalDataset) return;
        setUndoStack(prev => [...prev, dataset]);
        setRedoStack([]);
        setDataset(originalDataset);
        setAppliedOps([]);
        showToast("Reset to original dataset");
      };

      // Export file (CSV or XLSX)
      const exportFile = (format) => {
        const baseName = dataset.name.replace(/\.[^/.]+$/, "");
        const exportName = `${baseName}_cleaned.${format.toLowerCase()}`;

        if (format === 'XLSX') {
          const wsData = [dataset.columns, ...dataset.rows];
          const ws = window.XLSX.utils.aoa_to_sheet(wsData);
          const wb = window.XLSX.utils.book_new();

          link.setAttribute("download", exportName);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          id: Date.now().toString(),
          timestamp: Date.now(),

          finalRows: dataset.rows.length,

              const nb = parseFloat(vb);
              if (!isNaN(na) && !isNaN(nb)) {
                return sortAsc ? na - nb : nb - na;

              return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);

          rationale += "• Strip leading/trailing padding and collapse double spaces.\n";

          rationale += "• Standardize email addresses to lowercase.\n";

        if (q.includes("date") || q.includes("iso")) {
          ops.push("Standardize Dates to ISO");
          rationale += "• Standardize non-ISO dates to YYYY-MM-DD.\n";
        }
        if (q.includes("number") || q.includes("currency") || q.includes("price")) {
          ops.push("Clean & Convert to Numeric");
          rationale += "• Strip dollar signs and commas for clean numbers.\n";
        }

        if (ops.length === 0) {
          ops.push("Remove Empty Rows", "Remove Exact Duplicate Rows", "Trim All Whitespace");
          rationale = "• Proposed standard foundational cleaning sequence.";

                          <option value="Remove Empty Columns">2. Remove Empty Columns</option>
                          <option value="Remove Exact Duplicate Rows">3. Remove Exact Duplicate Rows</option>
                        </optgroup>
                        <optgroup label="Text Sanitization">
                          <option value="Trim All Whitespace">4. Trim All Whitespace</option>
                          <option value="Normalize Internal Spaces">5. Normalize Internal Spaces</option>
                          <option value="Convert to Lowercase">6. Convert to Lowercase</option>
                          <option value="Convert to Uppercase">7. Convert to Uppercase</option>
                          <option value="Convert to Title Case">8. Convert to Title Case</option>
                          <option value="Normalize Blank Values">9. Normalize Blanks / Nulls</option>
                          <option value="Fill Blanks with N/A">10. Fill Blanks with 'N/A'</option>
                        </optgroup>
                        <optgroup label="Format Standardization">
                          <option value="Clean & Convert to Numeric">11. Clean & Convert to Numeric</option>
                          <option value="Standardize Dates to ISO">12. Standardize Dates to ISO</option>
                          <option value="Clean Email Addresses">13. Clean Email Addresses</option>
                          <option value="Standardize Phone Numbers">14. Standardize Phone Numbers</option>
                        </optgroup>
                      </select>

                      {/* Density Toggle */}
                      <button
                        onClick={() => setDensity(d => d === 'compact' ? 'normal' : d === 'normal' ? 'comfortable' : 'compact')}
                        title="Toggle Row Density"
                        className="border border-brand-border px-2.5 py-1.5 rounded-lg text-xs font-medium text-brand-slate hover:bg-slate-50"
                      >
                        Density: <strong className="capitalize">{density}</strong>
                      </button>
                    </div>
                  </div>

                  {/* Data Table */}
                  <div className="flex-1 bg-white border border-brand-border rounded-xl shadow-sm overflow-hidden flex flex-col">
                    <div className="flex-1 overflow-auto custom-scrollbar">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100 border-b border-brand-border sticky top-0 z-10">
                            <th className="p-2.5 w-12 text-center font-bold text-slate-400 bg-slate-100 border-r border-slate-200">#</th>
                            {dataset.columns.map((col, idx) => (
                              <th
                                key={idx}
                                onClick={() => {
                                  if (sortCol === col) setSortAsc(!sortAsc);
                                  else { setSortCol(col); setSortAsc(true); }
                                }}
                                className="p-2.5 font-bold text-brand-navy border-r border-slate-200 hover:bg-slate-200/60 cursor-pointer whitespace-nowrap"
                              >
                                <div className="flex items-center justify-between space-x-1">
                                  <span>{col}</span>
                                  {sortCol === col && (
                                    <span className="text-brand-sky font-bold">{sortAsc ? '▲' : '▼'}</span>
                                  )}
                                </div>
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {pagedRows.map((row, rIdx) => {
                            const globalRowIdx = (currentPage * pageSize) + rIdx + 1;
                            const isRowEmpty = row.every(c => !c || c.toString().trim() === '');
                            return (
                              <tr
                                key={rIdx}
                                className={`hover:bg-sky-50/40 transition ${
                                  isRowEmpty ? 'bg-red-50/40' : rIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50/30'
                                }`}
                              >
                                <td className="p-2 text-center text-slate-400 font-mono text-[11px] border-r border-slate-100 bg-slate-50/50">
                                  {globalRowIdx}
                                </td>
                                {row.map((cell, cIdx) => (
                                  <td
                                    key={cIdx}
                                    className={`border-r border-slate-100 ${
                                      density === 'compact' ? 'py-1 px-2' : density === 'comfortable' ? 'py-3.5 px-3' : 'py-2 px-2.5'
                                    } ${
                                      (!cell || cell.trim() === '') ? 'text-slate-300 italic' : 'text-slate-700'
                                    }`}
                                  >
                                    {(!cell || cell.trim() === '') ? '•' : cell}
                                  </td>
                                ))}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>

                    {/* Pagination Bar */}
                    <div className="h-11 bg-slate-50 border-t border-brand-border px-4 flex items-center justify-between text-xs text-brand-slate shrink-0">
                      <div>
                        Showing <strong>{displayedRows.length === 0 ? 0 : (currentPage * pageSize) + 1}</strong> to <strong>{Math.min(displayedRows.length, (currentPage + 1) * pageSize)}</strong> of <strong>{displayedRows.length}</strong> rows
                      </div>
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => setCurrentPage(p => Math.max(0, p - 1))}
                          disabled={currentPage === 0}
                          className="px-2.5 py-1 border border-brand-border bg-white rounded disabled:opacity-30 hover:bg-slate-100"
                        >
                          Previous
                        </button>
                        <span>Page {currentPage + 1} of {totalPages}</span>
                        <button
                          onClick={() => setCurrentPage(p => Math.min(totalPages - 1, p + 1))}
                          disabled={currentPage >= totalPages - 1}
                          className="px-2.5 py-1 border border-brand-border bg-white rounded disabled:opacity-30 hover:bg-slate-100"
                        >
                          Next
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* --- SCREEN 5: SAVED PRESETS --- */}
              {currentScreen === 'presets' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div>
                    <h2 className="text-xl font-bold text-brand-navy">Reusable Cleaning Presets</h2>
                    <p className="text-xs text-brand-slate">Execute multi-step transformations sequentially in one click.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {presets.map(preset => (
                      <div key={preset.id} className="bg-white border border-brand-border rounded-xl p-5 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-2">
                            <h3 className="font-bold text-sm text-brand-navy">{preset.name}</h3>
                            {preset.isBuiltIn && (
                              <span className="text-[10px] bg-brand-skyLight text-brand-sky font-bold px-2 py-0.5 rounded">Built-in</span>
                            )}
                          </div>
                          <p className="text-xs text-slate-500 mb-3">{preset.description}</p>
                          <div className="bg-slate-50 rounded-lg p-2.5 space-y-1 mb-4">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide block">Operations Sequence:</span>
                            {preset.operations.map((op, i) => (
                              <div key={i} className="text-xs text-slate-700 flex items-center space-x-1.5">
                                <span className="text-brand-sky font-bold">{i+1}.</span>
                                <span>{op}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <button
                          onClick={() => {
                            let curr = dataset;
                            preset.operations.forEach(op => {
                              curr = applyOperation(curr, op);
                            });
                            setUndoStack(prev => [...prev, dataset]);
                            setDataset(curr);
                            setAppliedOps(prev => [...prev, ...preset.operations]);
                            setCurrentScreen('workspace');
                            showToast(`Executed preset: ${preset.name}`);
                          }}
                          className="w-full bg-brand-sky hover:bg-sky-600 text-white font-semibold text-xs py-2 rounded-lg"
                        >
                          Apply Preset to Dataset
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* --- SCREEN 6: JOB HISTORY --- */}
              {currentScreen === 'history' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-bold text-brand-navy">Cleaning Job History</h2>
                      <p className="text-xs text-brand-slate">Audit logs of completed spreadsheet exports stored in this browser.</p>
                    </div>
                    {history.length > 0 && (
                      <button
                        onClick={() => {
                          setHistory([]);
                          localStorage.removeItem('tablora_history');
                          showToast("History cleared");
                        }}
                        className="text-xs text-rose-600 hover:text-rose-700 font-semibold border border-rose-200 px-3 py-1.5 rounded-lg"
                      >
                        Clear History
                      </button>
                    )}
                  </div>

                  {history.length === 0 ? (
                    <div className="bg-white border border-brand-border rounded-xl p-8 text-center text-xs text-brand-slate">
                      No jobs recorded yet. Export a cleaned spreadsheet from the workspace to record your first audit log.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {history.map(item => (
                        <div key={item.id} className="bg-white border border-brand-border rounded-xl p-4 shadow-sm flex items-center justify-between text-xs">
                          <div>
                            <h4 className="font-bold text-brand-navy">{item.filename}</h4>
                            <p className="text-slate-500 text-[11px] mt-0.5">
                              {new Date(item.timestamp).toLocaleString()} • {item.operationsCount} operations
                            </p>
                          </div>
                          <div className="flex items-center space-x-3">
                            <span className="bg-emerald-50 text-brand-emerald font-bold px-2 py-0.5 rounded text-[11px]">
                              {item.originalRows} → {item.finalRows} rows
                            </span>
                            <span className="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-[11px]">
                              {item.exportFormat}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* --- SCREEN 7: PRICING --- */}
              {currentScreen === 'pricing' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="text-center max-w-xl mx-auto">
                    <span className="bg-brand-skyLight text-brand-sky text-xs font-bold px-2.5 py-1 rounded">TRANSPARENT PRICING</span>
                    <h2 className="text-2xl font-bold text-brand-navy mt-2">Simple, predictable plans</h2>
                    <p className="text-xs text-brand-slate mt-1">
                      Tablora is 100% free and fully functional offline today. Future cloud plans are shown below for transparency.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {/* Free Core */}
                    <div className="bg-white border-2 border-brand-sky rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                      <div>
                        <span className="text-[11px] font-bold text-brand-sky uppercase tracking-wide">ACTIVE PLAN</span>
                        <h3 className="text-lg font-bold text-brand-navy mt-1">Free Core</h3>
                        <div className="mt-3 flex items-baseline">
                          <span className="text-3xl font-extrabold text-brand-navy">$0</span>
                          <span className="text-slate-500 text-xs ml-1">/ forever</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">Complete on-device spreadsheet cleaning for freelancers and teams.</p>
                        <ul className="mt-5 space-y-2 text-xs text-slate-700">
                          <li>✓ Full CSV and XLSX import & export</li>
                          <li>✓ All 22 cleaning operations</li>
                          <li>✓ Undo, redo, and reset</li>
                          <li>✓ Deterministic data quality score</li>
                          <li>✓ 100% private, on-device processing</li>
                        </ul>
                      </div>
                      <button disabled className="w-full mt-6 bg-slate-100 text-slate-500 font-semibold text-xs py-2 rounded-lg cursor-default">
                        Current Active Plan
                      </button>
                    </div>

                    {/* Pro Plan */}
                    <div className="bg-white border border-brand-border rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                      <div>
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">PLANNED CLOUD TIER</span>
                        <h3 className="text-lg font-bold text-brand-navy mt-1">Pro</h3>
                        <div className="mt-3 flex items-baseline">
                          <span className="text-3xl font-extrabold text-brand-navy">$9</span>
                          <span className="text-slate-500 text-xs ml-1">/ month</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">For sellers and researchers needing multi-file batch automation.</p>
                        <ul className="mt-5 space-y-2 text-xs text-slate-500">
                          <li>✓ Everything in Free Core</li>
                          <li>• Batch multi-file cleaning (Planned)</li>
                          <li>• Scheduled automated cloud jobs (Planned)</li>
                          <li>• Custom regex mapping libraries (Planned)</li>
                        </ul>
                      </div>
                      <button disabled className="w-full mt-6 bg-slate-100 text-slate-400 font-semibold text-xs py-2 rounded-lg cursor-default">
                        Planned Feature
                      </button>
                    </div>

                    {/* Business Plan */}
                    <div className="bg-white border border-brand-border rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                      <div>
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">PLANNED CLOUD TIER</span>
                        <h3 className="text-lg font-bold text-brand-navy mt-1">Business</h3>
                        <div className="mt-3 flex items-baseline">
                          <span className="text-3xl font-extrabold text-brand-navy">$19</span>
                          <span className="text-slate-500 text-xs ml-1">/ month</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">For agencies and operations managing high-volume client datasets.</p>
                        <ul className="mt-5 space-y-2 text-xs text-slate-500">
                          <li>✓ Everything in Pro</li>
                          <li>• Collaborative team presets (Planned)</li>
                          <li>• Custom ERP & CRM connectors (Planned)</li>
                          <li>• Dedicated priority processing (Planned)</li>
                        </ul>
                      </div>
                      <button disabled className="w-full mt-6 bg-slate-100 text-slate-400 font-semibold text-xs py-2 rounded-lg cursor-default">
                        Planned Feature
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- SCREEN 8: SETTINGS --- */}
              {currentScreen === 'settings' && (
                <div className="max-w-3xl mx-auto space-y-6">
                  <div>
                    <h2 className="text-xl font-bold text-brand-navy">Preferences & Privacy</h2>
                    <p className="text-xs text-brand-slate">Configure application defaults and manage local storage.</p>
                  </div>

                  <div className="bg-white border border-brand-border rounded-xl p-5 shadow-sm space-y-4">
                    <h3 className="font-bold text-sm text-brand-navy">Display Preferences</h3>
                    <div className="flex items-center justify-between text-xs">
                      <span className="text-brand-slate">Table Row Density</span>
                      <div className="flex space-x-2">
                        {['compact', 'normal', 'comfortable'].map(d => (
                          <button
                            key={d}
                            onClick={() => setDensity(d)}
                            className={`px-3 py-1.5 rounded-lg border text-xs capitalize ${
                              density === d ? 'bg-brand-sky text-white border-brand-sky font-semibold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                            }`}
                          >
                            {d}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="bg-white border border-brand-border rounded-xl p-5 shadow-sm space-y-4">
                    <h3 className="font-bold text-sm text-brand-navy">Export Defaults</h3>
                    <div className="flex items-center justify-between text-xs">
                      <span className="text-brand-slate">Default Export File Format</span>
                      <div className="flex space-x-2">
                        {['CSV', 'XLSX'].map(f => (
                          <button
                            key={f}
                            onClick={() => setDefaultFormat(f)}
                            className={`px-3 py-1.5 rounded-lg border text-xs ${
                              defaultFormat === f ? 'bg-brand-sky text-white border-brand-sky font-semibold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                            }`}
                          >
                            {f}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-50 border border-brand-border rounded-xl p-5 shadow-sm space-y-3">
                    <h3 className="font-bold text-sm text-brand-navy flex items-center space-x-2">
                      <i data-lucide="shield" className="w-4 h-4 text-brand-sky"></i>
                      <span>Privacy Architecture Statement</span>
                    </h3>
                    <p className="text-xs text-brand-slate leading-relaxed">
                      • On-Device Core: 100% of spreadsheet parsing, deduplication, cleaning operations, and file exports execute locally in client memory.<br/>
                      • Local Persistence: Preferences, cleaning presets, and job metadata are saved to your device's local storage and never automatically synced.<br/>
                      • Zero Account Requirement: No account, login, or tracking cookies are required.
                    </p>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Operation Preview Diff Modal (Section 6 & 8) */}
          {activeModal === 'preview' && pendingOp && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-brand-border">
                <h3 className="font-bold text-base text-brand-navy">Confirm Operation</h3>
                <p className="text-xs text-slate-500 mt-1">
                  You are about to apply <strong>{pendingOp}</strong>.
                </p>
                <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 my-4 text-xs text-slate-700">
                  This operation modifies dataset rows in memory. You can always undo or reset back to the original dataset.
                </div>
                <div className="flex justify-end space-x-2">
                  <button
                    onClick={() => setActiveModal(null)}
                    className="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => executeOp(pendingOp)}
                    className="px-4 py-2 bg-brand-sky hover:bg-sky-600 text-white rounded-lg text-xs font-semibold"
                  >
                    Confirm & Apply
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Ask Tablora AI Modal (Section 9) */}
          {activeModal === 'ai' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-brand-border">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center space-x-2">
                    <div className="w-7 h-7 rounded-lg bg-brand-sky flex items-center justify-center text-white">
                      <i data-lucide="sparkles" className="w-4 h-4"></i>
                    </div>
                    <h3 className="font-bold text-base text-brand-navy">Ask Tablora</h3>
                  </div>
                  <button onClick={() => { setActiveModal(null); setAiPlan(null); }} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-500 mb-4">
                  Describe what you want to clean in plain English. Tablora generates a structured plan for your approval.
                </p>

                <textarea
                  value={aiPrompt}
                  onChange={(e) => setAiPrompt(e.target.value)}
                  placeholder="e.g. Remove duplicate customers by email and standardize dates to ISO format..."
                  rows="3"
                  className="w-full text-xs p-3 border border-brand-border rounded-lg focus:outline-none focus:border-brand-sky mb-3"
                ></textarea>

                <div className="flex flex-wrap gap-1.5 mb-4">
                  {[
                    "Remove duplicate rows and trim spaces",
                    "Clean and lowercase email addresses",
                    "Standardize all dates to ISO format",
                    "Clean currencies and convert numbers"
                  ].map((s, idx) => (
                    <button
                      key={idx}
                      onClick={() => setAiPrompt(s)}
                      className="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded"
                    >
                      {s}
                    </button>
                  ))}
                </div>

                {aiPlan ? (
                  <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4">
                    <span className="font-bold text-xs text-brand-emerald block mb-1">PROPOSED CLEANING PLAN</span>
                    <pre className="text-xs text-slate-700 whitespace-pre-wrap font-sans mb-3">{aiPlan.rationale}</pre>
                    <button
                      onClick={() => {
                        let curr = dataset;
                        aiPlan.ops.forEach(op => { curr = applyOperation(curr, op); });
                        setUndoStack(prev => [...prev, dataset]);
                        setDataset(curr);
                        setAppliedOps(prev => [...prev, ...aiPlan.ops]);
                        setActiveModal(null);
                        setAiPlan(null);
                        showToast(`Applied ${aiPlan.ops.length} AI cleaning operations!`);
                      }}
                      className="w-full bg-brand-emerald hover:bg-emerald-600 text-white font-semibold text-xs py-2 rounded-lg"
                    >
                      Approve & Execute Plan ({aiPlan.ops.length} steps)
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => { if (aiPrompt.trim()) generateAiPlan(aiPrompt); }}
                    className="w-full bg-brand-sky hover:bg-sky-600 text-white font-semibold text-xs py-2 rounded-lg"
                  >
                    Generate Cleaning Plan
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Export Center Modal (Section 11) */}
          {activeModal === 'export' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-brand-border">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-bold text-base text-brand-navy">Export Clean Dataset</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-500 mb-4">
                  Export your transformed dataset ({dataset.rows.length} rows × {dataset.columns.length} columns) to CSV or Excel.
                </p>

                <div className="space-y-3 mb-5">
                  <button
                    onClick={() => exportFile('CSV')}
                    className="w-full flex items-center justify-between p-3.5 border border-brand-border hover:border-brand-sky hover:bg-sky-50/40 rounded-xl transition text-left"
                  >
                    <div>
                      <h4 className="font-bold text-xs text-brand-navy">CSV (Comma-Separated Values)</h4>
                      <p className="text-[11px] text-slate-500">Universal text file. RFC-4180 compliant escaping.</p>
                    </div>
                    <i data-lucide="download" className="w-4 h-4 text-brand-sky"></i>
                  </button>

                  <button
                    onClick={() => exportFile('XLSX')}
                    className="w-full flex items-center justify-between p-3.5 border border-brand-border hover:border-brand-emerald hover:bg-emerald-50/40 rounded-xl transition text-left"
                  >
                    <div>
                      <h4 className="font-bold text-xs text-brand-navy">Microsoft Excel Workbook (.xlsx)</h4>
                      <p className="text-[11px] text-slate-500">Native OpenXML workbook compatible with Excel & Sheets.</p>
                    </div>
                    <i data-lucide="download" className="w-4 h-4 text-brand-emerald"></i>
                  </button>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setActiveModal(null)}
                    className="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-xs font-semibold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TabloraApp />);
  </script>
</body>
</html>
